[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecov-mcp"
version = "0.1.0"
description = "Read Codecov coverage from an MCP client, without rounding an absence to zero"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maksimtech" }]
keywords = ["mcp", "codecov", "coverage"]
dependencies = [
  # 2.x: FastMCP is MCPServer here, and ToolError is the path that keeps a
  # failure's message on the way to the client. The code depends on both.
  "mcp>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
codecov-mcp = "codecov_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["codecov_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test here is a coroutine and none of them wants a marker repeated 25
# times; the suite has no synchronous-only requirement to protect.
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# The same set the radars use, for the same reason: useful without being noisy.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A test may redefine a fixture name to make the case read.
"tests/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.11"
# Not strict: the MCP SDK's generated models would spend the errors on the edge
# rather than on this code.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
